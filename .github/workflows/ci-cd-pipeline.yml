name: DevFlow CI CD
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Empacotar a versao testada
        run: tar -czf release.tgz src package.json package-lock.json ecosystem.config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Copiar e implantar por SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/devflow/incoming"'
          scp "${opts[@]}" release.tgz "$DEPLOY_USER@$DEPLOY_HOST:devflow/incoming/$RELEASE_SHA.tgz"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RELEASE_SHA'" < scripts/deploy.sh
